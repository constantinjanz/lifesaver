<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifesaver — become the gatekeeper</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#0A0A0F;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
.card{width:100%;max-width:420px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
border-radius:24px;padding:28px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
h1{font-size:22px;font-weight:600;margin:0 0 8px}
p{color:rgba(255,255,255,.6);font-size:15px;line-height:1.5;margin:8px 0 18px}
input{width:100%;font-size:22px;letter-spacing:6px;text-align:center;padding:14px;border-radius:14px;
border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#fff;margin:8px 0 16px}
button{width:100%;padding:14px;border:0;border-radius:999px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.primary{background:#FF9500;color:#111}
.ok{color:#30D158}.bad{color:#FF453A}
</style>
</head>
<body>
<div class="card" id="card">
  <h1>Become the gatekeeper</h1>
  <p>Your friend uses Lifesaver to spend less time on Instagram &amp; YouTube. Set a secret PIN — they'll need you (and this PIN) to grant themselves more time. Don't tell them the PIN; that's the whole point.</p>
  <input id="pin" type="tel" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" placeholder="Set a 4–8 digit PIN">
  <button id="go" class="primary">Set PIN &amp; become their gatekeeper</button>
</div>
<script>
const FN = "https://lrpkvxqdsaavxmuxnjqi.supabase.co/functions/v1/buddy";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxycGt2eHFkc2FhdnhtdXhuanFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3OTcxMzAsImV4cCI6MjEwMDM3MzEzMH0.t-SdF2LIFNAqAL__nRxiBKFdTJShy4Hga1VDlALU0cU";
const q = new URLSearchParams(location.search);
const p = q.get("p"), t = q.get("t");
const card = document.getElementById("card");
document.getElementById("go").onclick = async () => {
  const pin = document.getElementById("pin").value.trim();
  if (!/^[0-9]{4,8}$/.test(pin)) { alert("PIN must be 4–8 digits"); return; }
  try {
    const r = await fetch(FN + "?action=set_pin", {
      method: "POST",
      headers: { "content-type": "application/json", "apikey": KEY, "authorization": "Bearer " + KEY },
      body: JSON.stringify({ p, t, pin }),
    });
    const d = await r.json();
    if (d.ok) card.innerHTML = '<h1 class="ok">You’re the gatekeeper 🔒</h1><p>From now on, when your friend wants more time, you’ll get a WhatsApp link. Enter your PIN there to approve. You can close this page.</p>';
    else if (d.error === "already_claimed") card.innerHTML = '<h1 class="ok">Already set up</h1><p>This buddy link already has a PIN. Nothing to do.</p>';
    else card.innerHTML = '<h1 class="bad">Invalid link</h1><p>This setup link is not valid.</p>';
  } catch (e) { alert("Network error — check your connection and try again."); }
};
</script>
</body>
</html>
